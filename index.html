<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12100f" />
    <title>Redirect — AllNet Private</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #12100f;
        --surface: #191615;
        --text: #fffdf9;
        --muted: #b9b4ae;
        --accent: #64ff73;
        --accent-muted: rgba(100, 255, 115, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
      }

      body,
      body.light,
      body.dark {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 50% -15%, rgba(100, 255, 115, 0.06), transparent 36%),
          var(--bg);
        color: var(--text);
        font-family: "Courier New", Courier, monospace;
      }

      .container {
        width: min(calc(100% - 40px), 760px);
        padding: clamp(28px, 6vw, 52px);
        border: 1px solid rgba(255, 253, 249, 0.3);
        background: rgba(25, 22, 21, 0.9);
        box-shadow: 8px 8px 0 rgba(100, 255, 115, 0.62);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 24px;
        color: var(--accent);
        font-size: 0.86rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .icon {
        width: 74px;
        height: 74px;
        margin: 0 auto 26px;
        display: grid;
        place-items: center;
        border: 1px solid var(--accent);
        color: var(--accent);
      }

      .icon svg {
        width: 39px;
        height: 39px;
        fill: currentColor;
        transform: rotate(90deg);
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.35rem, 8vw, 4.25rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      #instructions {
        margin: 18px auto 0;
        color: var(--accent);
        font-size: clamp(1rem, 2.8vw, 1.25rem);
        line-height: 1.55;
      }

      .button {
        min-height: 72px;
        margin: 34px 0 0;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--text);
        background: var(--surface);
        box-shadow: 7px 7px 0 rgba(100, 255, 115, 0.7);
        color: var(--text);
        font-size: clamp(1rem, 2.5vw, 1.22rem);
        font-weight: 400;
        text-decoration: none;
        transition:
          color 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease,
          transform 160ms ease;
      }

      .button::after {
        content: " →";
        color: var(--accent);
      }

      .button:hover {
        color: var(--accent);
        border-color: var(--accent);
        box-shadow: 3px 3px 0 rgba(100, 255, 115, 0.72);
        transform: translate(4px, 4px);
      }

      .button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 5px;
      }

      .progress-container {
        height: 3px;
        margin-top: 32px;
        overflow: hidden;
        background: var(--accent-muted);
      }

      .progress-bar {
        width: 100%;
        height: 100%;
        background: var(--accent);
        transition: width 50ms linear;
      }

      .hint {
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.5;
      }

      @media (max-width: 560px) {
        .container {
          width: min(calc(100% - 28px), 760px);
          padding: 30px 20px;
          box-shadow: 5px 5px 0 rgba(100, 255, 115, 0.62);
        }

        .icon {
          width: 64px;
          height: 64px;
        }

        .icon svg {
          width: 34px;
          height: 34px;
        }

        .button {
          min-height: 66px;
          box-shadow: 5px 5px 0 rgba(100, 255, 115, 0.7);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <p class="eyebrow">AllNet Private</p>

      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M13 19V11H17L12 4L7 11H11V19H13Z" />
        </svg>
      </div>

      <h1 id="title">Продолжить</h1>

      <p id="instructions">Переадресация произойдёт автоматически через 5 секунд</p>

      <a id="redirectLink" class="button" href="#">Перейти</a>

      <div class="progress-container" aria-hidden="true">
        <div class="progress-bar" id="progress"></div>
      </div>

      <p class="hint">Если переход не начался автоматически, нажмите кнопку.</p>
    </main>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const currentURL = window.location.href;
        let redirectTo = decodeURIComponent(currentURL.split('redirect_to=')[1] || '');

        const isRussian = navigator.language.startsWith('ru');

        const titleEl = document.getElementById('title');
        const linkEl = document.getElementById('redirectLink');
        const instructionsEl = document.getElementById('instructions');
        const progressBar = document.getElementById('progress');

        // Тексты
        if (isRussian) {
          titleEl.textContent = 'Продолжить';
          linkEl.textContent = 'Перейти дальше';
          instructionsEl.textContent = 'Автоматическая переадресация через 5 секунд';
        } else {
          titleEl.textContent = 'Continue';
          linkEl.textContent = 'Proceed';
          instructionsEl.textContent = 'You will be redirected automatically in 5 seconds';
        }

        linkEl.href = redirectTo || '#';

        // Темная/светлая тема
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.body.classList.add('dark');
        } else {
          document.body.classList.add('light');
        }

        if (!redirectTo) {
          alert(isRussian ? 'Не указана ссылка для перенаправления.' : 'No redirect link specified.');
          return;
        }

        // Прогресс-бар
        let timeLeft = 5000;
        const interval = setInterval(() => {
          timeLeft -= 50;
          const percent = (timeLeft / 5000) * 100;
          progressBar.style.width = `${percent}%`;

          if (timeLeft <= 0) clearInterval(interval);
        }, 50);

        // Автопереадресация
        const redirectTimer = setTimeout(() => {
          window.location.href = redirectTo;
        }, 5000);

        // Сброс таймера при клике
        linkEl.addEventListener('click', () => {
          clearTimeout(redirectTimer);
          clearInterval(interval);
        });
      });
    </script>
  </body>
</html>
