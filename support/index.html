<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Поддержка AllNet Private — Telegram, электронная почта и личный кабинет."
    />
    <meta name="theme-color" content="#12100f" />
    <title>IT support — AllNet Private</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #12100f;
        --surface: #191615;
        --text: #fffdf9;
        --accent: #64ff73;
        --accent-muted: rgba(100, 255, 115, 0.28);
        --content: 990px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
      }

      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        background:
          radial-gradient(circle at 50% -15%, rgba(100, 255, 115, 0.05), transparent 36%),
          var(--bg);
        color: var(--text);
        font-family: "Courier New", Courier, monospace;
      }

      .support {
        width: min(calc(100% - 40px), var(--content));
        min-height: 100svh;
        margin: 0 auto;
        padding: clamp(28px, 6vh, 64px) 0 48px;
        display: grid;
        place-content: center;
      }

      .support__inner {
        width: 100%;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.5rem, 5.2vw, 4.1rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .lead,
      .cabinet-copy {
        margin: 0;
        color: var(--accent);
        font-size: clamp(1.25rem, 3vw, 2rem);
        line-height: 1.45;
      }

      .lead {
        margin-top: 12px;
      }

      .contact-list {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
        margin-top: 16px;
      }

      .contact-link {
        position: relative;
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        color: var(--accent);
        border: 1px solid transparent;
        border-radius: 10px;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background-color 160ms ease;
      }

      .contact-link:hover {
        transform: translateY(-3px);
        border-color: var(--accent-muted);
        background: rgba(100, 255, 115, 0.04);
      }

      .contact-link:focus-visible,
      .cabinet-link:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 5px;
      }

      .contact-link svg {
        width: 40px;
        height: 40px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.9;
      }

      .contact-link--telegram svg {
        fill: currentColor;
        stroke: none;
      }

      .contact-link span {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .divider {
        height: 1px;
        margin: clamp(30px, 7vh, 52px) 0 clamp(28px, 6vh, 42px);
        border: 0;
        background: linear-gradient(90deg, transparent, var(--accent-muted) 8%, var(--accent-muted) 92%, transparent);
      }

      .cabinet-copy {
        max-width: 820px;
        margin-inline: auto;
      }

      .cabinet-link {
        min-height: 76px;
        margin-top: clamp(26px, 5vh, 38px);
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--text);
        background: var(--surface);
        box-shadow: 7px 7px 0 rgba(100, 255, 115, 0.7);
        color: var(--text);
        font-size: clamp(1rem, 2vw, 1.3rem);
        text-decoration: none;
        transition:
          color 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease,
          transform 160ms ease;
      }

      .cabinet-link:hover {
        color: var(--accent);
        border-color: var(--accent);
        box-shadow: 3px 3px 0 rgba(100, 255, 115, 0.72);
        transform: translate(4px, 4px);
      }

      @media (max-width: 560px) {
        .support {
          width: min(calc(100% - 28px), var(--content));
          padding-block: 28px;
        }

        .lead {
          max-width: 320px;
          margin-inline: auto;
        }

        .cabinet-link {
          min-height: 68px;
          box-shadow: 5px 5px 0 rgba(100, 255, 115, 0.7);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="support">
      <div class="support__inner">
        <h1>IT support</h1>
        <p class="lead">Пишите в Telegram или на почту</p>

        <nav class="contact-list" aria-label="Связаться с поддержкой">
          <a
            class="contact-link contact-link--telegram"
            href="https://telegram.me/allnetprivate_support"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Написать в Telegram"
            title="Telegram"
          >
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M43.2 7.1 36.7 38c-.5 2.2-1.8 2.8-3.7 1.7l-9.8-7.2-4.7 4.5c-.5.5-1 .9-2 .9l.7-10.1L35.6 11c.8-.7-.2-1.1-1.2-.4L11.7 24.9 2 21.9c-2.1-.7-2.2-2.1.4-3.1L40.3 4.2c1.8-.6 3.3.4 2.9 2.9Z" />
            </svg>
            <span>Telegram</span>
          </a>

          <a
            class="contact-link"
            href="mailto:ararouter@gmail.com"
            aria-label="Написать на ararouter@gmail.com"
            title="ararouter@gmail.com"
          >
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <rect x="5.5" y="10.5" width="37" height="27" rx="4" />
              <path d="m7 14 17 13 17-13" />
            </svg>
            <span>Электронная почта</span>
          </a>
        </nav>

        <hr class="divider" />

        <p class="cabinet-copy">Также можно написать через личный кабинет</p>
        <a
          class="cabinet-link"
          href="https://cabinet.bot-new.onepricevpn.ru/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Перейти в кабинет
        </a>
      </div>
    </main>
  </body>
</html>
